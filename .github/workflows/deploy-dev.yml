name: Deploy to DEV

# Centrally managed by ATLAS. Generated by sync-rules.ps1 from
# github/workflows/deploy-dev.yml in the ATLAS repository, using the settings in
# .agent/project.json. Local edits are overwritten on the next sync.
#
# Every merge to dev deploys to the shared DEV account, into atlas/<project>,
# and is verified against /__dev/probe. A deployment that cannot prove the
# running application serves the new commit fails.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/php-deploy-dev.yml
    with:
      php-version: "8.2"
      framework: microframework
      source-dir: "."
      exclude-file: .deployignore
      migrate: false
      probe-path: /__dev/probe
      probe-retries: 10
      log-fail-on: error
      dev-url: "https://exceedlimits.site/atlas/someonetechnical"
    secrets: inherit
