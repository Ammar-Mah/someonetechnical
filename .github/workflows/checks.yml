name: Checks

# Centrally managed by ATLAS. Generated by sync-rules.ps1 from
# github/workflows/checks.yml in the ATLAS repository, using the settings in
# .agent/project.json. Local edits are overwritten on the next sync.
#
# To change the configuration below, edit .agent/project.json and re-sync.
# The logic is php-checks.yml beside this file: ATLAS's workflow, copied in
# by the same sync. Change it in ATLAS, never here.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  checks:
    uses: ./.github/workflows/php-checks.yml
    with:
      php-version: "8.2"
      framework: microframework
      composer: false
      tests: true
      static-analysis: false
