name: Deploy to production

# Centrally managed by ATLAS. Generated by sync-rules.ps1 from
# github/workflows/deploy-prod.yml in the ATLAS repository, using the settings
# in .agent/project.json. Local edits are overwritten on the next sync.
#
# Deploys only from main. The `production` environment has a required reviewer,
# so the job pauses until a human approves it. Do not remove that gate — it is
# what makes promotion a human decision.
#
# Rollback:
#   gh workflow run deploy-prod.yml -f ref=<previous-good-sha>

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy. Leave empty for the current main. Set to roll back.
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/php-deploy-prod.yml
    with:
      php-version: "8.2"
      framework: microframework
      source-dir: "."
      exclude-file: .deployignore.production
      health-path: /health
      smoke-paths: "/"
      env-url: ""
      ref: ${{ inputs.ref || '' }}
    secrets: inherit
